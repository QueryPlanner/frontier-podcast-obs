<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=110, initial-scale=1">
  <title>The Frontier Podcast - Top Bar</title>
  <style>
    :root {
      --void: #05060d;
      --deep: #0b1027;
      --cyan: #35e0ff;
      --gold: #ffd27a;
      --paper: #f2f5ff;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --condensed: "Arial Narrow", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1920px;
      height: 110px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--paper);
      font-family: var(--sans);
      text-transform: uppercase;
    }

    .canvas {
      position: relative;
      width: 1920px;
      height: 110px;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      top: 12px;
      left: 0;
      width: 1920px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px 0 34px;
      background: rgba(5, 6, 13, 0.82);
      border-bottom: 1px solid var(--cyan);
      box-shadow: 0 3px 18px rgba(53, 224, 255, 0.23);
    }

    .bar::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 2px;
      background: rgba(242, 245, 255, 0.13);
      content: "";
    }

    .left-cluster {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .live {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ff5d66;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    .live-dot {
      display: inline-block;
      color: #ff4652;
      font-size: 25px;
      line-height: 0;
      transform: scale(1);
      transform-origin: center;
      animation: live-pulse 1.7s ease-in-out infinite;
    }

    .wordmark {
      max-width: 720px;
      overflow: hidden;
      color: var(--paper);
      font-family: var(--condensed);
      font-size: 27px;
      font-stretch: condensed;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .separator {
      width: 1px;
      height: 30px;
      background: rgba(242, 245, 255, 0.25);
    }

    .clock-label {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.18em;
      white-space: nowrap;
    }

    .clock {
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding-left: 2px;
      white-space: nowrap;
    }

    .clock-time {
      color: var(--paper);
      font-family: var(--mono);
      font-size: 23px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .clock-zone {
      color: var(--gold);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .clock-date {
      padding-left: 12px;
      border-left: 1px solid rgba(242, 245, 255, 0.25);
      color: rgba(242, 245, 255, 0.7);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .presented {
      height: 52px;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 22px;
      background: var(--cyan);
      color: var(--void);
      border-left: 4px solid var(--paper);
      text-align: left;
    }

    .presented-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      line-height: 1;
    }

    .presented-value {
      overflow: hidden;
      font-family: var(--condensed);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 0.72; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bar">
      <div class="left-cluster">
        <div class="live"><span class="live-dot" data-animate aria-hidden="true">●</span><span>LIVE</span></div>
        <span class="separator" aria-hidden="true"></span>
        <div class="wordmark" id="wordmark">THE FRONTIER PODCAST</div>
        <span class="separator" aria-hidden="true"></span>
        <span class="clock-label">LIVE CLOCK</span>
        <time class="clock" id="clock" datetime="">
          <span class="clock-time" id="clock-time">--:--</span>
          <span class="clock-zone" id="clock-zone">LOCAL</span>
          <span class="clock-date" id="clock-date">---- -- --</span>
        </time>
      </div>
      <div class="presented">
        <span class="presented-label">PRESENTED BY</span>
        <span class="presented-value" id="presented-by">lordpatil.com</span>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    function readText(name, fallback, limit = 160) {
      const value = params.get(name);
      if (!value || !value.trim()) return fallback;
      return value.replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, limit);
    }

    const show = readText("show", readText("wordmark", "THE FRONTIER PODCAST"));
    const presentedBy = readText("presentedBy", readText("presented-by", "lordpatil.com"), 80);
    document.getElementById("wordmark").textContent = show;
    document.getElementById("presented-by").textContent = presentedBy;

    const clockTime = document.getElementById("clock-time");
    const clockZone = document.getElementById("clock-zone");
    const clockDate = document.getElementById("clock-date");
    const clock = document.getElementById("clock");
    const timeFormatter = new Intl.DateTimeFormat(undefined, {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
      timeZoneName: "short"
    });
    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "short",
      day: "2-digit"
    });

    function updateClock() {
      const now = new Date();
      const parts = timeFormatter.formatToParts(now);
      const hour = parts.find((part) => part.type === "hour")?.value || "--";
      const minute = parts.find((part) => part.type === "minute")?.value || "--";
      const zone = parts.find((part) => part.type === "timeZoneName")?.value || "LOCAL";
      clockTime.textContent = `${hour}:${minute}`;
      clockZone.textContent = zone;
      clockDate.textContent = dateFormatter.format(now).toUpperCase();
      clock.dateTime = now.toISOString();
    }

    updateClock();
    window.setInterval(updateClock, 1000);

    // Debug-only: freeze animations at t seconds for deterministic screenshots.
    // Must test presence explicitly -- params.get() returns null when absent and
    // Number(null) is 0, which is finite and >= 0, so a bare Number() check
    // freezes every animation at time zero in normal playback.
    const freezeRaw = params.get("t");
    const freezeAt = Number(freezeRaw);
    if (freezeRaw !== null && freezeRaw.trim() !== "" &&
        Number.isFinite(freezeAt) && freezeAt >= 0) {
      window.requestAnimationFrame(() => {
        document.querySelectorAll("[data-animate]").forEach((element) => {
          element.getAnimations().forEach((animation) => {
            animation.pause();
            animation.currentTime = freezeAt * 1000;
          });
        });
      });
    }
  </script>
</body>
</html>
