<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>The Frontier Podcast - Title Card</title>
  <style>
    :root {
      --void: #05060d;
      --deep: #0b1027;
      --cyan: #35e0ff;
      --gold: #ffd27a;
      --paper: #f2f5ff;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --condensed: "Arial Narrow", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: var(--void);
    }

    body {
      color: var(--paper);
      font-family: var(--sans);
      text-transform: uppercase;
    }

    .canvas {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(24, 38, 75, 0.56) 0%, rgba(5, 6, 13, 0.88) 56%, var(--void) 100%),
        var(--void);
    }

    .nebula {
      position: absolute;
      pointer-events: none;
      filter: blur(38px);
      opacity: 0.38;
    }

    .nebula-a {
      top: 80px;
      left: -180px;
      width: 880px;
      height: 560px;
      background: radial-gradient(ellipse, rgba(39, 125, 165, 0.25), rgba(18, 42, 90, 0.08) 55%, transparent 76%);
      transform: rotate(-15deg);
    }

    .nebula-b {
      right: -170px;
      bottom: 100px;
      width: 850px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(87, 38, 126, 0.24), rgba(45, 24, 81, 0.08) 55%, transparent 76%);
      transform: rotate(17deg);
    }

    .stars {
      position: absolute;
      top: -140px;
      left: -140px;
      width: 2200px;
      height: 1360px;
      pointer-events: none;
      background-repeat: no-repeat;
      transform: translate3d(0, 0, 0);
    }

    .stars-far {
      opacity: 0.42;
      background-image:
        radial-gradient(circle at 4% 15%, rgba(242, 245, 255, 0.68) 0 1px, transparent 1.8px),
        radial-gradient(circle at 12% 70%, rgba(242, 245, 255, 0.5) 0 1px, transparent 1.8px),
        radial-gradient(circle at 20% 30%, rgba(53, 224, 255, 0.45) 0 1px, transparent 1.8px),
        radial-gradient(circle at 29% 86%, rgba(242, 245, 255, 0.62) 0 1px, transparent 1.8px),
        radial-gradient(circle at 38% 19%, rgba(242, 245, 255, 0.52) 0 1px, transparent 1.8px),
        radial-gradient(circle at 47% 61%, rgba(255, 210, 122, 0.45) 0 1px, transparent 1.8px),
        radial-gradient(circle at 56% 9%, rgba(242, 245, 255, 0.62) 0 1px, transparent 1.8px),
        radial-gradient(circle at 65% 77%, rgba(242, 245, 255, 0.55) 0 1px, transparent 1.8px),
        radial-gradient(circle at 74% 42%, rgba(53, 224, 255, 0.42) 0 1px, transparent 1.8px),
        radial-gradient(circle at 83% 15%, rgba(242, 245, 255, 0.65) 0 1px, transparent 1.8px),
        radial-gradient(circle at 92% 68%, rgba(242, 245, 255, 0.56) 0 1px, transparent 1.8px),
        radial-gradient(circle at 97% 34%, rgba(255, 210, 122, 0.46) 0 1px, transparent 1.8px);
      animation: title-far-drift 52s ease-in-out infinite alternate;
    }

    .stars-mid {
      opacity: 0.62;
      background-image:
        radial-gradient(circle at 7% 45%, rgba(242, 245, 255, 0.82) 0 1.3px, transparent 2.6px),
        radial-gradient(circle at 17% 12%, rgba(53, 224, 255, 0.63) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 25% 79%, rgba(242, 245, 255, 0.7) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 36% 32%, rgba(255, 210, 122, 0.7) 0 1.3px, transparent 2.6px),
        radial-gradient(circle at 45% 91%, rgba(242, 245, 255, 0.65) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 55% 22%, rgba(242, 245, 255, 0.8) 0 1.3px, transparent 2.6px),
        radial-gradient(circle at 64% 65%, rgba(53, 224, 255, 0.68) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 73% 8%, rgba(242, 245, 255, 0.76) 0 1.3px, transparent 2.6px),
        radial-gradient(circle at 84% 50%, rgba(242, 245, 255, 0.65) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 94% 83%, rgba(53, 224, 255, 0.64) 0 1.2px, transparent 2.5px);
      animation: title-mid-drift 39s ease-in-out infinite alternate;
    }

    .grid-line {
      position: absolute;
      top: 0;
      left: 960px;
      width: 1px;
      height: 1080px;
      background: linear-gradient(180deg, transparent, rgba(53, 224, 255, 0.12) 42%, transparent 74%);
      opacity: 0.35;
    }

    .hero {
      position: absolute;
      top: 200px;
      left: 340px;
      width: 1240px;
      height: 680px;
      opacity: 1;
      transform: translate3d(0, 0, 0);
      animation: hero-entrance 2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-ambient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1240px;
      height: 680px;
      transform: translate3d(0, 0, 0);
      animation: ambient-float 18s ease-in-out 2s infinite alternate;
    }

    .orbit-svg {
      position: absolute;
      top: 76px;
      left: 120px;
      width: 1000px;
      height: 520px;
      overflow: visible;
      transform: rotate(-3deg);
      transform-origin: 500px 260px;
      animation: orbit-turn 38s linear 2s infinite;
    }

    .orbit-faint {
      fill: none;
      stroke: rgba(53, 224, 255, 0.16);
      stroke-width: 1;
    }

    .orbit-cyan {
      fill: none;
      stroke: var(--cyan);
      stroke-linecap: round;
      stroke-width: 2;
    }

    .orbit-gold {
      fill: none;
      stroke: var(--gold);
      stroke-dasharray: 2 10;
      stroke-linecap: round;
      stroke-width: 2;
    }

    .orbit-dot-cyan { fill: var(--cyan); }
    .orbit-dot-gold { fill: var(--gold); }

    .lockup {
      position: absolute;
      top: 174px;
      left: 0;
      width: 1240px;
      text-align: center;
    }

    .eyebrow {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.32em;
      line-height: 1;
    }

    .wordmark {
      margin: 24px 0 0;
      color: var(--paper);
      font-family: var(--condensed);
      font-size: 108px;
      font-stretch: condensed;
      font-weight: 950;
      letter-spacing: -0.08em;
      line-height: 0.88;
      text-shadow: 0 0 28px rgba(53, 224, 255, 0.14);
      white-space: nowrap;
    }

    #wordmark-accent {
      color: var(--cyan);
    }

    .tagline {
      margin: 32px auto 0;
      color: rgba(242, 245, 255, 0.82);
      font-family: var(--condensed);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.22em;
      line-height: 1.25;
    }

    .signal-rule {
      width: 520px;
      height: 1px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 30px auto 0;
      background: linear-gradient(90deg, transparent, rgba(53, 224, 255, 0.8), transparent);
    }

    .signal-rule::before,
    .signal-rule::after {
      width: 5px;
      height: 5px;
      flex: 0 0 5px;
      background: var(--gold);
      content: "";
    }

    .footer-mark {
      position: absolute;
      right: 44px;
      bottom: 38px;
      color: rgba(242, 245, 255, 0.45);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    @keyframes hero-entrance {
      0% { opacity: 0; transform: translate3d(0, 42px, 0) scale(0.965); }
      62% { opacity: 1; transform: translate3d(0, -4px, 0) scale(1.008); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes ambient-float {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(0, -8px, 0); }
    }

    @keyframes orbit-turn {
      from { transform: rotate(-3deg); }
      to { transform: rotate(357deg); }
    }

    @keyframes title-far-drift {
      from { transform: translate3d(-16px, 9px, 0); }
      to { transform: translate3d(16px, -9px, 0); }
    }

    @keyframes title-mid-drift {
      from { transform: translate3d(22px, -12px, 0); }
      to { transform: translate3d(-22px, 12px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars,
      .hero,
      .hero-ambient,
      .orbit-svg { animation: none; }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="stars stars-far" data-animate></div>
    <div class="stars stars-mid" data-animate></div>
    <div class="grid-line"></div>

    <div class="hero" data-animate>
      <div class="hero-ambient" data-animate>
        <svg class="orbit-svg" data-animate viewBox="0 0 1000 520" aria-hidden="true">
          <ellipse class="orbit-faint" cx="500" cy="260" rx="470" ry="128" transform="rotate(-18 500 260)"></ellipse>
          <ellipse class="orbit-cyan" cx="500" cy="260" rx="452" ry="112" transform="rotate(-18 500 260)"></ellipse>
          <ellipse class="orbit-gold" cx="500" cy="260" rx="386" ry="154" transform="rotate(61 500 260)"></ellipse>
          <path class="orbit-faint" d="M 50 260 H 950"></path>
          <circle class="orbit-dot-cyan" cx="90" cy="194" r="5"></circle>
          <circle class="orbit-dot-gold" cx="878" cy="340" r="4"></circle>
          <circle class="orbit-dot-cyan" cx="500" cy="260" r="3"></circle>
        </svg>

        <div class="lockup">
          <div class="eyebrow" id="eyebrow">A LIVE CONVERSATION AT THE EDGE OF WHAT'S NEXT</div>
          <h1 class="wordmark" id="wordmark"><span id="wordmark-main">THE FRONTIER</span> <span id="wordmark-accent">PODCAST</span></h1>
          <div class="tagline" id="tagline">SIGNALS, STORIES, AND THE PEOPLE BUILDING TOMORROW</div>
          <div class="signal-rule" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="footer-mark" id="footer-mark">LORDPATIL.COM // FRONTIER SIGNAL 01</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    function readText(name, fallback, limit = 160) {
      const value = params.get(name);
      if (!value || !value.trim()) return fallback;
      return value.replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, limit);
    }

    const show = readText("show", "THE FRONTIER PODCAST", 80);
    const tagline = readText("tagline", "SIGNALS, STORIES, AND THE PEOPLE BUILDING TOMORROW", 140);
    const eyebrow = readText("eyebrow", "A LIVE CONVERSATION AT THE EDGE OF WHAT'S NEXT", 120);
    const presentedBy = readText("presentedBy", "lordpatil.com", 80);
    const showWords = show.split(" ");
    const accentWord = showWords.length > 1 ? showWords.pop() : "";
    document.getElementById("wordmark-main").textContent = showWords.join(" ");
    document.getElementById("wordmark-accent").textContent = accentWord;
    document.getElementById("tagline").textContent = tagline;
    document.getElementById("eyebrow").textContent = eyebrow;
    document.getElementById("footer-mark").textContent = `${presentedBy} // FRONTIER SIGNAL 01`;

    // Debug-only: freeze animations at t seconds for deterministic screenshots.
    // Must test presence explicitly -- params.get() returns null when absent and
    // Number(null) is 0, which is finite and >= 0, so a bare Number() check
    // freezes every animation at time zero in normal playback.
    const freezeRaw = params.get("t");
    const freezeAt = Number(freezeRaw);
    if (freezeRaw !== null && freezeRaw.trim() !== "" &&
        Number.isFinite(freezeAt) && freezeAt >= 0) {
      window.requestAnimationFrame(() => {
        document.querySelectorAll("[data-animate]").forEach((element) => {
          element.getAnimations().forEach((animation) => {
            animation.pause();
            animation.currentTime = freezeAt * 1000;
          });
        });
      });
    }
  </script>
</body>
</html>
