<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>The Frontier Podcast - Starfield</title>
  <style>
    :root {
      --void: #05060d;
      --deep: #0b1027;
      --cyan: #35e0ff;
      --gold: #ffd27a;
      --paper: #f2f5ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: var(--void);
    }

    .canvas {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 52% 43%, rgba(11, 16, 39, 0.86) 0%, rgba(5, 6, 13, 0.96) 64%, rgba(5, 6, 13, 1) 100%),
        var(--void);
    }

    .nebula {
      position: absolute;
      pointer-events: none;
      filter: blur(34px);
      opacity: 0.45;
      transform: translate3d(0, 0, 0);
    }

    .nebula-a {
      top: 70px;
      left: -180px;
      width: 840px;
      height: 520px;
      background: radial-gradient(ellipse, rgba(35, 105, 161, 0.28) 0%, rgba(16, 46, 96, 0.15) 42%, transparent 73%);
      transform: rotate(-14deg);
    }

    .nebula-b {
      top: 430px;
      right: -220px;
      width: 920px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(77, 34, 113, 0.23) 0%, rgba(42, 25, 76, 0.12) 42%, transparent 73%);
      transform: rotate(17deg);
    }

    .nebula-c {
      top: 210px;
      left: 660px;
      width: 720px;
      height: 380px;
      background: radial-gradient(ellipse, rgba(31, 80, 112, 0.12) 0%, transparent 70%);
      opacity: 0.3;
      transform: rotate(-4deg);
    }

    .star-layer {
      position: absolute;
      top: -120px;
      left: -120px;
      width: 2160px;
      height: 1320px;
      pointer-events: none;
      background-repeat: no-repeat;
      transform: translate3d(0, 0, 0);
    }

    .stars-far {
      opacity: 0.46;
      background-image:
        radial-gradient(circle at 4% 9%, rgba(242, 245, 255, 0.72) 0 1px, transparent 1.8px),
        radial-gradient(circle at 11% 62%, rgba(242, 245, 255, 0.5) 0 1px, transparent 1.7px),
        radial-gradient(circle at 17% 23%, rgba(242, 245, 255, 0.62) 0 1px, transparent 1.8px),
        radial-gradient(circle at 24% 81%, rgba(242, 245, 255, 0.5) 0 1px, transparent 1.7px),
        radial-gradient(circle at 31% 13%, rgba(242, 245, 255, 0.68) 0 1px, transparent 1.8px),
        radial-gradient(circle at 38% 54%, rgba(242, 245, 255, 0.48) 0 1px, transparent 1.7px),
        radial-gradient(circle at 45% 29%, rgba(242, 245, 255, 0.55) 0 1px, transparent 1.7px),
        radial-gradient(circle at 52% 88%, rgba(242, 245, 255, 0.64) 0 1px, transparent 1.8px),
        radial-gradient(circle at 59% 18%, rgba(242, 245, 255, 0.48) 0 1px, transparent 1.7px),
        radial-gradient(circle at 66% 69%, rgba(242, 245, 255, 0.62) 0 1px, transparent 1.8px),
        radial-gradient(circle at 74% 39%, rgba(242, 245, 255, 0.5) 0 1px, transparent 1.7px),
        radial-gradient(circle at 81% 8%, rgba(242, 245, 255, 0.7) 0 1px, transparent 1.8px),
        radial-gradient(circle at 88% 78%, rgba(242, 245, 255, 0.45) 0 1px, transparent 1.7px),
        radial-gradient(circle at 96% 31%, rgba(242, 245, 255, 0.62) 0 1px, transparent 1.8px),
        radial-gradient(circle at 7% 40%, rgba(53, 224, 255, 0.46) 0 1px, transparent 1.7px),
        radial-gradient(circle at 28% 45%, rgba(53, 224, 255, 0.35) 0 1px, transparent 1.7px),
        radial-gradient(circle at 63% 51%, rgba(53, 224, 255, 0.38) 0 1px, transparent 1.7px),
        radial-gradient(circle at 92% 56%, rgba(255, 210, 122, 0.42) 0 1px, transparent 1.7px);
      animation: far-drift 58s ease-in-out infinite alternate;
    }

    .stars-mid {
      opacity: 0.65;
      background-image:
        radial-gradient(circle at 2% 49%, rgba(242, 245, 255, 0.8) 0 1.4px, transparent 2.5px),
        radial-gradient(circle at 9% 17%, rgba(242, 245, 255, 0.72) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 15% 88%, rgba(53, 224, 255, 0.72) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 22% 34%, rgba(242, 245, 255, 0.62) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 29% 72%, rgba(242, 245, 255, 0.76) 0 1.4px, transparent 2.5px),
        radial-gradient(circle at 36% 5%, rgba(255, 210, 122, 0.65) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 43% 44%, rgba(242, 245, 255, 0.7) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 50% 78%, rgba(53, 224, 255, 0.62) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 57% 25%, rgba(242, 245, 255, 0.8) 0 1.4px, transparent 2.5px),
        radial-gradient(circle at 64% 93%, rgba(242, 245, 255, 0.56) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 71% 57%, rgba(242, 245, 255, 0.7) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 79% 14%, rgba(53, 224, 255, 0.68) 0 1.3px, transparent 2.5px),
        radial-gradient(circle at 86% 83%, rgba(242, 245, 255, 0.7) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 93% 37%, rgba(255, 210, 122, 0.6) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 18% 63%, rgba(242, 245, 255, 0.58) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 48% 15%, rgba(242, 245, 255, 0.58) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 77% 74%, rgba(242, 245, 255, 0.56) 0 1.2px, transparent 2.4px);
      animation: mid-drift 44s ease-in-out infinite alternate;
    }

    .stars-near {
      opacity: 0.72;
      background-image:
        radial-gradient(circle at 6% 29%, rgba(242, 245, 255, 0.92) 0 1.8px, transparent 3px),
        radial-gradient(circle at 13% 76%, rgba(53, 224, 255, 0.84) 0 1.6px, transparent 3px),
        radial-gradient(circle at 25% 8%, rgba(242, 245, 255, 0.86) 0 1.6px, transparent 3px),
        radial-gradient(circle at 34% 64%, rgba(255, 210, 122, 0.78) 0 1.6px, transparent 3px),
        radial-gradient(circle at 45% 21%, rgba(242, 245, 255, 0.82) 0 1.6px, transparent 3px),
        radial-gradient(circle at 56% 82%, rgba(53, 224, 255, 0.78) 0 1.6px, transparent 3px),
        radial-gradient(circle at 67% 37%, rgba(242, 245, 255, 0.9) 0 1.8px, transparent 3px),
        radial-gradient(circle at 78% 67%, rgba(242, 245, 255, 0.78) 0 1.6px, transparent 3px),
        radial-gradient(circle at 89% 12%, rgba(53, 224, 255, 0.76) 0 1.6px, transparent 3px),
        radial-gradient(circle at 97% 91%, rgba(242, 245, 255, 0.86) 0 1.6px, transparent 3px);
      animation: near-drift 34s ease-in-out infinite alternate;
    }

    .vignette {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(5, 6, 13, 0.18) 57%, rgba(5, 6, 13, 0.9) 100%);
    }

    .quiet-axis {
      position: absolute;
      z-index: 4;
      top: 470px;
      left: 320px;
      width: 1280px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(53, 224, 255, 0.14), transparent);
      opacity: 0.45;
    }

    @keyframes far-drift {
      from { transform: translate3d(-18px, 10px, 0); }
      to { transform: translate3d(18px, -10px, 0); }
    }

    @keyframes mid-drift {
      from { transform: translate3d(26px, -15px, 0); }
      to { transform: translate3d(-26px, 15px, 0); }
    }

    @keyframes near-drift {
      from { transform: translate3d(-38px, 22px, 0); }
      to { transform: translate3d(38px, -22px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star-layer { animation: none; }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="nebula nebula-c"></div>
    <div class="star-layer stars-far" data-animate></div>
    <div class="star-layer stars-mid" data-animate></div>
    <div class="star-layer stars-near" data-animate></div>
    <div class="quiet-axis"></div>
    <div class="vignette"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    // Debug-only: freeze animations at t seconds for deterministic screenshots.
    // Must test presence explicitly -- params.get() returns null when absent and
    // Number(null) is 0, which is finite and >= 0, so a bare Number() check
    // freezes every animation at time zero in normal playback.
    const freezeRaw = params.get("t");
    const freezeAt = Number(freezeRaw);
    if (freezeRaw !== null && freezeRaw.trim() !== "" &&
        Number.isFinite(freezeAt) && freezeAt >= 0) {
      window.requestAnimationFrame(() => {
        document.querySelectorAll("[data-animate]").forEach((element) => {
          element.getAnimations().forEach((animation) => {
            animation.pause();
            animation.currentTime = freezeAt * 1000;
          });
        });
      });
    }
  </script>
</body>
</html>
